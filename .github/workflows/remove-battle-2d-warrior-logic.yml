name: Remove battle 2D warrior logic

'on':
  workflow_dispatch:
  push:
    paths:
      - '.github/scripts/remove_battle_2d_warrior_logic.py'
      - '.github/workflows/remove-battle-2d-warrior-logic.yml'

jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Remove legacy battle 2D warrior renderer
        run: python .github/scripts/remove_battle_2d_warrior_logic.py
      - name: Verify gameplay 2D warrior paths are gone
        run: |
          grep -Fq 'BATTLE_2D_WARRIOR_RENDERING_REMOVED_2026_09_02' index.html
          ! grep -Fq 'SOLAR_CREW_HIT' index.html
          ! grep -Fq 'SOLAR_CASUALTY' index.html
          ! grep -Fq 'xrayArtTextureForWarrior' index.html
          ! grep -Fq 'crewSilhouetteTexture' index.html
          ! grep -Fq 'crewTextureForSide' index.html
          ! grep -Fq 'w.sprite' index.html
          grep -Fq 'flashWarrior3DHit' index.html
          grep -Fq 'WARRIOR_ANCHOR_' index.html
      - name: Commit gameplay patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Remove legacy 2D warrior rendering from battle"
          git push
