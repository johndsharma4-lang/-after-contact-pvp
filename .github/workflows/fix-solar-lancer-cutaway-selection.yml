name: Fix Solar Lancer in-room 3D and selection

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/fix-solar-lancer-cutaway-selection.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Patch Solar Lancer presentation and selection
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path("index.html")
          s = p.read_text(encoding="utf-8")

          for required in ["function buildSolarLancer3DModel()", "w.model3D=model"]:
              if required not in s:
                  raise SystemExit("Refusing to patch: missing " + required)

          if 'id="solar-lancer-inroom-hotfix"' not in s:
              css = '''
          <style id="solar-lancer-inroom-hotfix">
            #warriorCutaway,
            #xrayBtn {
              display: none !important;
              pointer-events: none !important;
            }
          </style>
          '''
              if "</head>" not in s:
                  raise SystemExit("Refusing to patch: </head> not found")
              s = s.replace("</head>", css + "\n</head>", 1)

          # Prevent selection from forcing the old private cutaway/XRAY mode.
          s, xray_count = re.subn(
              r"xrayOpen\s*=\s*!!\s*selectedWarrior\s*;",
              "xrayOpen=false;",
              s
          )

          # Keep the old sprite invisible whenever a real 3D model exists.
          s = s.replace(
              "if(w.sprite?.material){w.sprite.material.opacity=1;w.sprite.material.needsUpdate=true;}",
              "if(w.sprite?.material){w.sprite.material.opacity=w.model3D?0:1;w.sprite.material.needsUpdate=true;}"
          )
          s = s.replace(
              "if(w.sprite?.material){w.sprite.material.opacity=.12;w.sprite.material.needsUpdate=true;}",
              "if(w.sprite?.material){w.sprite.material.opacity=w.model3D?0:.12;w.sprite.material.needsUpdate=true;}"
          )

          # Do not alter setWarriorRoom or any room-index assignment logic.
          p.write_text(s, encoding="utf-8")
          print("PASS: in-room 3D presentation patch written")
          print("PASS: automatic XRAY assignments disabled:", xray_count)
          print("PASS: warrior movement/room assignment code untouched")
          PY

      - name: Commit fixed index and remove one-time workflow
        shell: bash
        run: |
          rm -f .github/workflows/fix-solar-lancer-cutaway-selection.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/fix-solar-lancer-cutaway-selection.yml
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Fix Solar Lancer in-room 3D and warrior selection"
          git push origin HEAD:main
