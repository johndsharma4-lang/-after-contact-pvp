name: Inspect cutaway selection
on:
  push:
    branches: [main]
    paths: ['.github/workflows/inspect-cutaway-selection.yml']
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - run: python3 .github/scripts/inspect_cutaway_selection.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cutaway-selection-diagnostic.txt
          git commit -m "Add cutaway selection diagnostic"
          git push origin HEAD:main
