name: Run Solar Lancer 3D upgrade

on:
  push:
    branches: [main]
    paths: ['.github/workflows/run-solar-lancer-upgrade.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Patch character
        run: python3 .github/scripts/upgrade_solar_lancer_3d.py
      - name: Commit result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Upgrade Solar Lancer articulated 3D character"
          git push origin HEAD:main
