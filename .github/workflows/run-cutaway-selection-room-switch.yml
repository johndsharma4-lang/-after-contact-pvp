name: Run cutaway room switching fix
on:
  push:
    branches: [main]
    paths: ['.github/workflows/run-cutaway-selection-room-switch.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Patch and verify selection room switching
        run: python3 .github/scripts/fix_cutaway_selection_room_switch.py
      - name: Commit gameplay fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --check
          git commit -m "Rebuild 3D compartment when switching warriors"
          git push origin HEAD:main
