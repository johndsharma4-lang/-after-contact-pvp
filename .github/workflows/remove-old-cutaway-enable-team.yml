name: Remove old cutaway enable team
on:
  push:
    branches: [main]
    paths: ['.github/workflows/remove-old-cutaway-enable-team.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - run: python3 .github/scripts/remove_old_cutaway_enable_team.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Remove old cutaway and restore warrior selection safely"
          git push origin HEAD:main
