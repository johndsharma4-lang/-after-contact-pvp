name: Run real hull firing stage fix
on:
  push:
    paths:
      - '.github/scripts/use_real_hull_for_firing_stage.py'
      - '.github/workflows/run-real-hull-firing-stage.yml'
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: python .github/scripts/use_real_hull_for_firing_stage.py
      - run: |
          grep -q "realHullModules=Y" index.html
          grep -q "fakeShutters=N" index.html
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Use real hull for selected warrior firing stage"
          git push
