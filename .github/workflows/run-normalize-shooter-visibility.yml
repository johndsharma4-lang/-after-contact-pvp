name: Run shooter lock and cutaway visibility correction
on:
  push:
    paths:
      - '.github/scripts/normalize_shooter_lock_and_dim_cutaway.py'
      - '.github/workflows/run-normalize-shooter-visibility.yml'
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: python .github/scripts/normalize_shooter_lock_and_dim_cutaway.py
      - run: |
          grep -q "TAP A WARRIOR ONCE TO HIGHLIGHT" index.html
          grep -q "rig3D.scale.setScalar(.92)" index.html
          grep -q "roomLight.intensity=chosen?.72:.28" index.html
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Normalize shooter selection and reveal cutaway warriors"
          git push
