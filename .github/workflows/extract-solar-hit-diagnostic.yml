name: Extract Solar Lancer hit diagnostic

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/extract-solar-hit-diagnostic.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Extract relevant firing and collision code
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8').splitlines()
          terms=['solar_lancer','solar lancer','lance','laser','projectile','trajectory','aim','raycaster','intersect','collision','fortress','shield','damage','fireweapon','shoot','weaponkey']
          hit=[]
          for i,line in enumerate(s):
              low=line.lower()
              if any(t in low for t in terms): hit.append(i)
          ranges=[]
          for i in hit:
              a=max(0,i-14); b=min(len(s),i+20)
              if ranges and a <= ranges[-1][1]+3:
                  ranges[-1]=(ranges[-1][0],max(ranges[-1][1],b))
              else:
                  ranges.append((a,b))
          out=[]
          out.append('INDEX_LINES='+str(len(s)))
          for a,b in ranges:
              out.append(f'--- LINES {a+1}-{b} ---')
              out.extend(f'{j+1}: {s[j]}' for j in range(a,b))
          Path('solar-hit-diagnostic.txt').write_text('\n'.join(out),encoding='utf-8')
          print('WROTE',len(out),'diagnostic lines')
          PY
      - name: Commit diagnostic and remove extractor workflow
        shell: bash
        run: |
          rm -f .github/workflows/extract-solar-hit-diagnostic.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add solar-hit-diagnostic.txt .github/workflows/extract-solar-hit-diagnostic.yml
          git commit -m "Add Solar Lancer hit diagnostic"
          git push origin HEAD:main
