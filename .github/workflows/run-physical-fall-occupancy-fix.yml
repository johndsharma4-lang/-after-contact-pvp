name: Run physical fall occupancy fix
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/scripts/fix_physical_fall_occupancy.py'
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Patch collapse physics
        run: python .github/scripts/fix_physical_fall_occupancy.py
      - name: Verify
        run: |
          grep -q "BLOCKED FALL IMPACT +3%" index.html
          grep -q "CREW PHYSICAL FALL" index.html
          grep -q "blockedFallKey" index.html
      - name: Commit gameplay fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Enforce physical collapse falls without warrior stacking"
          git push
