name: Fix Solar Lancer 3D room rendering

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/fix-solar-lancer-3d-render.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Patch Solar Lancer 3D visibility and depth
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p=Path('index.html')
          s=p.read_text(encoding='utf-8')

          old_create="model.scale.setScalar(.62);\n    model.position.copy(w.sprite.position);"
          new_create="model.scale.setScalar(.52);\n    model.position.copy(w.sprite.position);\n    model.position.z+=1.35; // pull the real 3D warrior forward into the visible compartment volume\n    model.traverse(o=>{if(o.isMesh){o.frustumCulled=false;o.renderOrder=24}});"
          if old_create not in s:
              raise SystemExit('Refusing to patch: Solar Lancer model creation block not found')
          s=s.replace(old_create,new_create,1)

          old_room="if(w.model3D)w.model3D.position.copy(w.sprite.position);"
          new_room="if(w.model3D){w.model3D.position.copy(w.sprite.position);w.model3D.position.z+=1.35;}"
          if old_room not in s:
              raise SystemExit('Refusing to patch: model room-position sync line not found')
          s=s.replace(old_room,new_room,1)

          old_vis="if(w.model3D)w.model3D.visible=w.sprite.visible;"
          new_vis="if(w.model3D){const own3D=!multiplayer?w.side==='aurelian':w.side===localSide;w.model3D.visible=!!(w.active&&w.hp>0&&(own3D||w.sprite.visible));}"
          if old_vis not in s:
              raise SystemExit('Refusing to patch: model visibility sync line not found')
          s=s.replace(old_vis,new_vis,1)

          # setWarriorObjectsVisible must not force the real player model off just because the hidden sprite is off.
          old_objs="for(const obj of [w.sprite,w.marker,w.hpBack,w.hpFill,w.model3D])if(obj)obj.visible=on;"
          new_objs="for(const obj of [w.sprite,w.marker,w.hpBack,w.hpFill])if(obj)obj.visible=on;if(w.model3D){const own3D=!multiplayer?w.side==='aurelian':w.side===localSide;w.model3D.visible=!!(w.active&&w.hp>0&&(own3D||on));}"
          if old_objs not in s:
              raise SystemExit('Refusing to patch: warrior visibility object list not found')
          s=s.replace(old_objs,new_objs,1)

          checks=['model.position.z+=1.35','o.frustumCulled=false','own3D=!multiplayer','w.model3D.visible=!!(w.active&&w.hp>0']
          missing=[x for x in checks if x not in s]
          if missing:
              raise SystemExit('Patch verification failed: '+', '.join(missing))

          p.write_text(s,encoding='utf-8')
          print('PASS: Solar Lancer 3D model decoupled from hidden hit-test sprite')
          print('PASS: local player Solar Lancer remains visible while alive/active')
          print('PASS: model moved forward into visible compartment volume')
          print('PASS: warrior room assignment/movement rules untouched')
          PY

      - name: Commit 3D render fix and remove temporary workflow
        shell: bash
        run: |
          rm -f .github/workflows/fix-solar-lancer-3d-render.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/fix-solar-lancer-3d-render.yml
          git commit -m "Fix Solar Lancer 3D room rendering"
          git push origin HEAD:main
