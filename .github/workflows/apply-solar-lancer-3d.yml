name: Inspect cutaway and warrior selection

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-solar-lancer-3d.yml

permissions:
  contents: read

jobs:
  inspect-index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Inspect cutaway and selection code
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text().splitlines()
          terms=['cutaway','Cutaway','CUTAWAY','selectedWarrior','selectedObject','setWarriorRoom','setWarriorObjectsVisible','updateUnitVisuals','model3D','roomGroup','solar_lancer']
          hits=[]
          for i,line in enumerate(s):
            if any(t in line for t in terms): hits.append(i)
          emitted=set()
          for i in hits:
            a=max(0,i-8); b=min(len(s),i+13)
            key=(a,b)
            if key in emitted: continue
            emitted.add(key)
            print(f'--- LINES {a+1}-{b} ---')
            for j in range(a,b): print(f'{j+1}: {s[j]}')
          PY
