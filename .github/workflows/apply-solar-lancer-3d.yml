name: Apply Solar Lancer 3D patch

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-solar-lancer-3d.yml

permissions:
  contents: write

jobs:
  patch-index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Patch index.html exactly
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('index.html')
          s = path.read_text()

          patch1 = r'''function buildSolarLancer3DModel(){
            const g=new THREE.Group();
            const gold=new THREE.MeshStandardMaterial({color:0xc99a3a,metalness:.82,roughness:.28});
            const goldBright=new THREE.MeshStandardMaterial({color:0xffd65a,metalness:.7,roughness:.22,emissive:0xffae1f,emissiveIntensity:.6});
            const white=new THREE.MeshStandardMaterial({color:0xf0ead9,metalness:.15,roughness:.55});
            const dark=new THREE.MeshStandardMaterial({color:0x2a2115,metalness:.6,roughness:.4});
            const visor=new THREE.MeshStandardMaterial({color:0xfff6d0,emissive:0xffcf5e,emissiveIntensity:1.8,metalness:.3,roughness:.2});

            const torso=new THREE.Mesh(new THREE.CylinderGeometry(.62,.82,2.5,10),gold);torso.position.y=1.1;g.add(torso);
            const chest=new THREE.Mesh(new THREE.SphereGeometry(.68,18,12),goldBright);chest.scale.set(.92,1.05,.55);chest.position.y=1.95;g.add(chest);
            for(const sx of [-1,1]){
              const shoulder=new THREE.Mesh(new THREE.SphereGeometry(.42,16,12),gold);shoulder.position.set(sx*.95,2.2,0);g.add(shoulder);
              const spike=new THREE.Mesh(new THREE.ConeGeometry(.16,.62,8),goldBright);spike.position.set(sx*1.05,2.65,-.05);spike.rotation.z=sx*.35;g.add(spike);
            }
            const head=new THREE.Mesh(new THREE.SphereGeometry(.46,20,16),white);head.scale.set(.82,1.05,.85);head.position.y=3.15;g.add(head);
            const helmetCrest=new THREE.Mesh(new THREE.ConeGeometry(.10,.9,6),goldBright);helmetCrest.position.set(0,3.75,-.05);g.add(helmetCrest);
            const faceVisor=new THREE.Mesh(new THREE.SphereGeometry(.20,12,10),visor);faceVisor.scale.set(1,.6,.5);faceVisor.position.set(0,3.1,.38);g.add(faceVisor);
            const halo=new THREE.Mesh(new THREE.TorusGeometry(.62,.06,10,32),goldBright);halo.position.set(0,3.25,-.35);g.add(halo);
            for(const sx of [-1,1]){
              const upperArm=new THREE.Mesh(new THREE.CylinderGeometry(.19,.22,1.1,8),gold);upperArm.position.set(sx*1.0,1.75,0);upperArm.rotation.z=sx*.18;g.add(upperArm);
              const forearm=new THREE.Mesh(new THREE.CylinderGeometry(.16,.19,1.0,8),white);forearm.position.set(sx*1.25,.9,.1);forearm.rotation.z=sx*.28;g.add(forearm);
              const gauntlet=new THREE.Mesh(new THREE.SphereGeometry(.22,10,8),goldBright);gauntlet.position.set(sx*1.42,.35,.15);g.add(gauntlet);
            }
            for(const sx of [-1,1]){
              const thigh=new THREE.Mesh(new THREE.CylinderGeometry(.26,.30,1.3,8),gold);thigh.position.set(sx*.36,-.2,0);g.add(thigh);
              const shin=new THREE.Mesh(new THREE.CylinderGeometry(.20,.24,1.2,8),white);shin.position.set(sx*.36,-1.4,.08);g.add(shin);
              const boot=new THREE.Mesh(new THREE.BoxGeometry(.34,.28,.62),dark);boot.position.set(sx*.36,-2.1,.22);g.add(boot);
            }
            const cape=new THREE.Mesh(new THREE.PlaneGeometry(1.4,2.6,4,6),new THREE.MeshStandardMaterial({color:0xf3ecd6,metalness:.05,roughness:.85,side:THREE.DoubleSide}));
            cape.position.set(0,.9,-.55);cape.rotation.x=.15;g.add(cape);
            const lanceShaft=new THREE.Mesh(new THREE.CylinderGeometry(.05,.07,3.4,8),dark);lanceShaft.rotation.z=-Math.PI/2.4;lanceShaft.position.set(1.75,1.1,.4);g.add(lanceShaft);
            const lanceTip=new THREE.Mesh(new THREE.ConeGeometry(.16,.7,10),goldBright);lanceTip.rotation.z=-Math.PI/2.4;lanceTip.position.set(3.05,1.85,.4);g.add(lanceTip);
            const lanceGlow=glowSphere(.22,0xffe58a,6);lanceGlow.position.copy(lanceTip.position);g.add(lanceGlow);
            return g;
          }
          '''

          portrait = 'function renderStarter3DPortrait(type){'
          assert portrait in s, 'Patch 1 target missing'
          assert 'function buildSolarLancer3DModel(){' not in s, 'Patch 1 already present'
          s = s.replace(portrait, patch1 + portrait, 1)

          warriors = "const aWarriors=makeWarriors('aurelian',aRooms,[4,5,3],lancerTex,'solar_lancer');const eWarriors=makeWarriors('earth',eRooms,[5,4,3],bombTex,'bombardier');"
          patch2 = r'''for(const w of aWarriors){
            if(w.weaponKey==='solar_lancer'){
              const model=buildSolarLancer3DModel();
              model.scale.setScalar(.62);
              model.position.copy(w.sprite.position);
              if(w.side==='aurelian')model.rotation.y=Math.PI;
              w.roomGroup.add(model);
              w.model3D=model;
              w.sprite.material.opacity=0; // keep sprite for hit-testing/position math, just invisible
            }
          }'''
          assert warriors in s, 'Patch 2 target missing'
          assert 'w.model3D=model;' not in s, 'Patch 2 already present'
          s = s.replace(warriors, warriors + '\n' + patch2, 1)

          def function_region(text, signature):
            start = text.find(signature)
            assert start >= 0, f'Function target missing: {signature}'
            end = text.find('\nfunction ', start + len(signature))
            if end < 0:
              end = len(text)
            return start, end

          # Patch 3 only inside setWarriorRoom.
          start, end = function_region(s, 'function setWarriorRoom(w,roomIndex){')
          region = s[start:end]
          room_pos = "w.sprite.position.copy(room.local).add(new THREE.Vector3(0,-.1,-.75));"
          assert room_pos in region, 'Patch 3 target missing inside setWarriorRoom'
          assert 'if(w.model3D)w.model3D.position.copy(w.sprite.position);' not in region, 'Patch 3 already present'
          region = region.replace(room_pos, room_pos + '\n  if(w.model3D)w.model3D.position.copy(w.sprite.position);', 1)
          s = s[:start] + region + s[end:]

          # Patch 4 only inside setWarriorObjectsVisible.
          start, end = function_region(s, 'function setWarriorObjectsVisible(w,visible){')
          region = s[start:end]
          old_vis = 'for(const obj of [w.sprite,w.marker,w.hpBack,w.hpFill])if(obj)obj.visible=on;'
          new_vis = 'for(const obj of [w.sprite,w.marker,w.hpBack,w.hpFill,w.model3D])if(obj)obj.visible=on;'
          assert old_vis in region, 'Patch 4 target missing inside setWarriorObjectsVisible'
          region = region.replace(old_vis, new_vis, 1)
          s = s[:start] + region + s[end:]

          # Patch 5 only inside updateUnitVisuals.
          start, end = function_region(s, 'function updateUnitVisuals(){')
          region = s[start:end]
          conceal = 'syncWarriorConcealment(w);'
          model_vis = 'if(w.model3D)w.model3D.visible=w.sprite.visible;'
          assert conceal in region, 'Patch 5 target missing inside updateUnitVisuals'
          assert model_vis not in region, 'Patch 5 already present'
          region = region.replace(conceal, conceal + '\n    ' + model_vis, 1)
          s = s[:start] + region + s[end:]

          # Verify every requested change exactly once or at least in its target function.
          assert s.count('function buildSolarLancer3DModel(){') == 1
          assert s.count('w.model3D=model;') == 1
          assert 'if(w.model3D)w.model3D.position.copy(w.sprite.position);' in s
          assert new_vis in s
          assert model_vis in s

          path.write_text(s)
          PY

      - name: Commit requested index.html change
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --check
          git diff --cached --quiet && exit 0
          git commit -m "Add Solar Lancer 3D battle model"
          git push origin HEAD:main
