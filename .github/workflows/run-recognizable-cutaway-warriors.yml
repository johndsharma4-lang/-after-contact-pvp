name: Run recognizable 3D cutaway warrior upgrade
on:
  push:
    paths:
      - '.github/scripts/upgrade_cutaway_warriors_recognizable_3d.py'
      - '.github/workflows/run-recognizable-cutaway-warriors.yml'
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: python .github/scripts/upgrade_cutaway_warriors_recognizable_3d.py
      - run: |
          grep -q "WEAPON_MUZZLE_RIG" index.html
          grep -q "animationReady=true" index.html
          grep -q "SOLAR_DISK" index.html
          grep -q "SOLAR_GRENADE" index.html
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Upgrade cutaway warriors to recognizable 3D models"
          git push
