name: Run Aurelian weapon route fix

'on':
  workflow_dispatch:
  push:
    paths:
      - '.github/scripts/add_aurelian_weapon_routes.py'
      - '.github/workflows/run-aurelian-weapon-routes.yml'

jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python .github/scripts/add_aurelian_weapon_routes.py
      - run: |
          grep -q "sun_disk_gunner:{name:'SOLAR DISK CUTTER'" index.html
          grep -q "sunadier:{name:'ABYSS-CHAIN SOLAR GRENADE'" index.html
          grep -q "weapon.kind==='sun_disk'" index.html
          grep -q "weapon.kind==='sun_grenade'" index.html
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Wire Sun Disk Gunner and Sunadier combat routes"
          git push
