name: Run cutaway-only 3D rig rebuild
on:
  push:
    paths:
      - '.github/scripts/rebuild_cutaway_only_3d_rigs.py'
      - '.github/workflows/run-cutaway-only-3d-rigs.yml'
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: python .github/scripts/rebuild_cutaway_only_3d_rigs.py
      - run: |
          grep -q "buildCutawayOnlyWarrior3D" index.html
          grep -q "CUTAWAY 3D RIG" index.html
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Rebuild cutaway warriors as independent visible 3D rigs"
          git push
