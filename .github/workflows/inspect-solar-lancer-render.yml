name: Inspect Solar Lancer render and selection

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/inspect-solar-lancer-render.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Print relevant index code
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text().splitlines()
          terms=['buildSolarLancer3DModel','model3D','selectedWarrior','xrayOpen','warriorCutaway','setWarriorRoom','setWarriorObjectsVisible','updateUnitVisuals','roomGroup','sprite.visible','weaponKey===\'solar_lancer\'']
          hits=[]
          for i,line in enumerate(s):
            if any(t in line for t in terms): hits.append(i)
          seen=[]
          for i in hits:
            a=max(0,i-12); b=min(len(s),i+18)
            if any(a>=x and b<=y for x,y in seen): continue
            seen.append((a,b))
            print(f'--- LINES {a+1}-{b} ---')
            for j in range(a,b): print(f'{j+1}: {s[j]}')
          PY
