name: Remove stale xray label material logic

'on':
  workflow_dispatch:
  push:
    paths:
      - '.github/scripts/remove_stale_xray_label_material_logic.py'
      - '.github/workflows/remove-stale-xray-label-material-logic.yml'

jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Remove stale cutaway label material logic
        run: python .github/scripts/remove_stale_xray_label_material_logic.py
      - name: Verify label cleanup
        run: |
          grep -Fq 'XRAY_LABEL_MATERIAL_STALE_LOGIC_REMOVED_2026_09_03' index.html
          ! grep -Fq 'v.label.material.opacity' index.html
          ! grep -Fq 'v.label.material.color' index.html
          grep -Fq 'CUTAWAY_STATUS_LABEL_DISABLED_2D_REMOVED' index.html
      - name: Commit gameplay patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Remove stale cutaway label material access"
          git push
